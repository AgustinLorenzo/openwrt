name: Build IPQ807x NSS WiFi

on: workflow_dispatch

jobs:
    build:
        name: Prepare and build IPQ807x NSS generic images
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Update and install feeds
              run: |
                ./scripts/feeds update -a
                ./scripts/feeds install -a

            - name: Fix i2c-tools FileExistsError
              run: |
                # Apply workaround for i2c-tools python3-smbus FileExistsError
                # Based on commit 71bfbaa969f694da008a4bafa2b73c003ac8ac47
                I2C_MAKEFILE="feeds/packages/utils/i2c-tools/Makefile"
                if [ -f "$I2C_MAKEFILE" ]; then
                  echo "Applying i2c-tools build fix..."
                  # Add cleanup step before python build to prevent FileExistsError  
                  sed -i '/define Build\/Install/a\\t# Clean existing python files to prevent FileExistsError\n\trm -f $(PKG_BUILD_DIR)/ipkg-install/usr/lib/python*/site-packages/smbus*.so 2>/dev/null || true' "$I2C_MAKEFILE"
                  echo "i2c-tools FileExistsError fix applied"
                else
                  echo "Warning: i2c-tools Makefile not found"
                fi

            - name: Import full config for IPQ807x NSS Generic
              run: |
                mv .full_config .config

            - name: Setup EMC2301 fan controller
              run: |
                # Create init script for EMC2301 fan controller (survives updates)
                mkdir -p files/etc/init.d
                cat > files/etc/init.d/emc2301-init << 'EOF'
                #!/bin/sh /etc/rc.common
                
                START=99
                STOP=10
                
                start() {
                    echo "Initializing EMC2301 fan controller..."
                    
                    # Wait for I2C bus to be ready
                    sleep 10
                    
                    # Check if I2C bus exists
                    if [ -d "/sys/bus/i2c/devices/i2c-0" ]; then
                        # Register EMC2301 device if not already exists
                        if [ ! -d "/sys/bus/i2c/devices/0-002f" ]; then
                            echo emc2301 0x2f > /sys/bus/i2c/devices/i2c-0/new_device 2>/dev/null
                            sleep 3
                        fi
                        
                        # Configure EMC2301 registers if i2cset is available
                        if command -v i2cset >/dev/null 2>&1; then
                            i2cset -f -y 0 0x2f 0x38 0x18 2>/dev/null  # Config register
                            i2cset -f -y 0 0x2f 0x2b 0x01 2>/dev/null  # Enable fan
                            sleep 1
                        fi
                        
                        # Set PWM value - find correct hwmon device
                        for hwmon in /sys/class/hwmon/hwmon*; do
                            if [ -f "$hwmon/name" ] && [ "$(cat $hwmon/name 2>/dev/null)" = "emc2305" ]; then
                                if [ -f "$hwmon/pwm1" ]; then
                                    echo 60 > "$hwmon/pwm1" 2>/dev/null
                                    echo "EMC2301 initialized: $hwmon"
                                    break
                                fi
                            fi
                        done
                        echo "EMC2301 fan controller initialized"
                    else
                        echo "Warning: I2C bus not found"
                    fi
                }
                
                stop() {
                    echo "Stopping EMC2301 fan controller"
                }
                EOF
                chmod +x files/etc/init.d/emc2301-init
                
                # Create uci-defaults to enable the service (runs on first boot and after sysupgrade)
                mkdir -p files/etc/uci-defaults
                cat > files/etc/uci-defaults/98-emc2301-enable << 'EOF'
                #!/bin/sh
                # Enable EMC2301 fan controller service
                /etc/init.d/emc2301-init enable
                /etc/init.d/emc2301-init start
                exit 0
                EOF
                chmod +x files/etc/uci-defaults/98-emc2301-enable

            - name: QoL fixes on default config
              run: |
                mkdir -p files/etc/uci-defaults
                cat > files/etc/uci-defaults/99-qol_fixes << EOF
                uci set wireless.radio0.country='US'
                uci set wireless.radio1.country='US'
                uci set wireless.radio2.country='US'
                uci set wireless.radio0.disabled=0
                uci set wireless.radio1.disabled=0
                uci set pbuf.opt.memory_profile=auto
                uci set firewall.@defaults[0].flow_offloading=0
                uci set ecm.@general[0].enable_bridge_filtering=0
                uci set system.@system[0].cronloglevel='7'
                /etc/init.d/mwan3 stop
                /etc/init.d/mwan3 disable
                /etc/init.d/sqm stop
                /etc/init.d/sqm disable
                uci commit
                EOF

            - name: Download package sources
              run: make download V=s

            - name: Build tools
              run: |
                make tools/install -j$(nproc) V=s || \
                make tools/install V=s

            - name: Build toolchain
              run: |
                make toolchain/install -j$(nproc) V=s || \
                make toolchain/install V=s

            - name: Build target images
              run: |
                make -j$(nproc) V=s || \
                make V=s

            - name: Get the current date
              run: |
                echo "NOW=$(date +%F-%H%M)" >> $GITHUB_ENV
                echo "NOWWEB=$(date +%Y%m%d)" >> $GITHUB_ENV

            - name: Create a release
              uses: "ncipollo/release-action@v1"
              with:
                name: "Updated prebuilt images (NSS-WiFi) ${{ env.NOW }}"
                commit: "main_nss"
                tag: "ipq807x-nsswifi-${{ env.NOW }}"
                generateReleaseNotes: true
                makeLatest: true
                artifacts: bin/targets/qualcommax/ipq807x/*
                token: "${{ secrets.GITHUB_TOKEN }}"


